name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out ACVP test vectors
        uses: actions/checkout@v4
        with:
          repository: kriskwiatkowski/crypto-test-vectors
          path: crypto-test-vectors
          persist-credentials: false

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose

      - name: Run KAT
        run: cargo run --example kat_tests

      - name: Verify ACVP vectors
        run: |
          ACVP_DIR="$RUNNER_TEMP/acvp-cli"
          VECTORS="$GITHUB_WORKSPACE/crypto-test-vectors/vectors/acvp/FIPS-203"

          mkdir "$ACVP_DIR"
          curl -A 'cargo/1.85.0 (linux)' -fsSL \
            https://crates.io/api/v1/crates/acvp-cli/0.0.1/download |
            tar -xz -C "$ACVP_DIR" --strip-components=1

          cat >> "$ACVP_DIR/Cargo.toml" <<EOF
          [patch.crates-io]
          mlkem-ref = { path = "$GITHUB_WORKSPACE" }
          EOF

          cargo build --release \
            --manifest-path "$ACVP_DIR/Cargo.toml" \
            --bin acvp-cli --bin mlkem_wrapper

          ACVP="$ACVP_DIR/target/release/acvp-cli"
          WRAPPER="$ACVP_DIR/target/release/mlkem_wrapper"

          "$ACVP" --wrapper "$WRAPPER" \
            --in "$VECTORS/keyGen/prompt.json" \
            --out "$RUNNER_TEMP/keygen-responses.json" \
            --expected "$VECTORS/keyGen/expectedResults.json"

          "$ACVP" --wrapper "$WRAPPER" \
            --in "$VECTORS/encapsDecap/prompt.json" \
            --out "$RUNNER_TEMP/encaps-decap-responses.json" \
            --expected "$VECTORS/encapsDecap/expectedResults.json"

  #      - name: Check formatting
  #        run: cargo fmt -- --check

  #      - name: Run clippy
  #        run: cargo clippy -- -D warnings

  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release --verbose
